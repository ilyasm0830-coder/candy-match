 if(sel&&Math.abs(sel[0]-r)+Math.abs(sel[1]-c)==1){const s=sel;return act(s[0],s[1],r,c)}
 sel=[r,c];render();snd(500,.06);arm()}
$('bd').onpointerdown=e=>{const c=e.target.closest('.c');if(c)st={r:+c.dataset.r,c:+c.dataset.c,x:e.clientX,y:e.clientY}};
window.onpointerup=e=>{if(!st)return;const s=st;st=null;if(busy||!$('game').classList.contains('on'))return;
 const dx=e.clientX-s.x,dy=e.clientY-s.y;
 if(Math.abs(dx)>18||Math.abs(dy)>18){const h=Math.abs(dx)>Math.abs(dy);act(s.r,s.c,s.r+(h?0:Math.sign(dy)),s.c+(h?Math.sign(dx):0))}else tap(s.r,s.c)};
function conf(){const k=['#ff3d94','#ffb300','#35c2ff','#7be04a','#a35cff'];for(let i=0;i<50;i++){const d=document.createElement('b');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=k[i%5];d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function end(){clearInterval(tt);const win=met(),r=mv/TM,s=win?(r>.4?3:r>.2?2:1):0,mb=$('mb');
 const rw=win?s*10+(L>=40&&!S.st[L]?100:0):0;if(win){if(s>(S.st[L]||0))S.st[L]=s;S.coins+=rw;ach('w');if(s==3)ach('s3');if(L>=40)ach('gc');sv();conf();snd(784,.4)}
 mb.innerHTML=win?'<h1>Amazing! 🎉</h1><div class="stars">'+'⭐'.repeat(s)+'</div><div>Score: '+sc+' · 🪙 +'+rw+'</div>'+(L<49?'<button id="nx">Next level</button>':'<div>All levels complete! 🏆</div>')+'<button class="g" id="mp2">Map</button>':'<h1>'+(mv>0?'Time is up! ⏱':'Almost there! 🐻')+'</h1><div>'+gtxt()+'</div><button id="rt">Try again</button><button class="g" id="mp2">Map</button>';
 $('md').classList.add('on');
 const b=(i,f)=>{const e=$(i);if(e)e.onclick=()=>{$('md').classList.remove('on');f()}};
 b('nx',()=>start(L+1));b('rt',()=>start(L));b('mp2',mapScr)}
$('play').onclick=mapScr;$('home').onclick=()=>show('wel');$('back').onclick=()=>{clearHint();clearInterval(tt);mapScr()};
$('ham').onclick=()=>{if(busy)return;if(ham<1){if(S.coins>=30){S.coins-=30;ham++;sv();upd();say('Hammer bought! 🪙 -30')}else say('You need 30 🪙 for a hammer');return}hamOn=!hamOn;say(hamOn?'Tap any candy 🔨':'Hammer cancelled')};
$('snd1').onclick=tog;$('snd2').onclick=tog;$('vb1').onclick=togv;$('vb2').onclick=togv;sndBtn();bg(0);
const lj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},ls=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}},idx=()=>lj('cma_idx',[]),esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),AV=['🐻','🐰','🐱','🦊','🐼','🦄','🐸','🐯'],er=t=>{$('er').textContent=t};
const hs=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cma'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('cma'+p)}};
function loadS(d){S={st:[],snd:1,vib:1,coins:0,ach:{},gift:'',...(d||lj(KEY,{}))}}
function home(){$('pfb').textContent=P?P.av+' '+P.n:'👤 Login / Sign up';bg(0);show('wel')}
function enter(u,m,d){P=u;KEY='cma_p_'+(U?U.uid:u.n);loadS(d);sndBtn();home();if(m){$('mb').innerHTML='<div class="big">'+u.av+'</div><h1>'+m+'</h1><div>'+esc(u.n)+'</div><button id="pl">▶ Play now</button>';$('md').classList.add('on');$('pl').onclick=()=>{$('md').classList.remove('on');mapScr()}}}
const AM=c=>({'auth/email-already-in-use':'That nickname is already taken','auth/invalid-credential':'Wrong nickname or PIN','auth/wrong-password':'Wrong nickname or PIN','auth/user-not-found':'Wrong nickname or PIN','auth/too-many-requests':'Too many tries. Please wait a bit.','auth/network-request-failed':'No internet connection'}[c]||'Something went wrong. Try again.');
const em=n=>n.toLowerCase()+'@candymatch.app',pw=p=>p+'candy';
async function pull(u){try{const d=await getDoc(doc(db,'players',u.uid));return d.exists()?d.data():null}catch(e){return null}}
function cloud(){if(!U||!P)return;clearTimeout(tm);tm=setTimeout(()=>{setDoc(doc(db,'players',U.uid),{n:P.n,av:P.av,data:S,t:Date.now()},{merge:true}).catch(()=>{})},1200)}
function authScr(m){const b=$('ab');$('tl').classList.toggle('on',m!='s');$('ts').classList.toggle('on',m=='s');
 const pin=(id,l)=>'<label class="fl">'+l+'<div class="pw"><input id="'+id+'" class="in" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button type="button" data-e="'+id+'">👁</button></div></label>';
 const nk='<label class="fl">Nickname<input id="nm" class="in" maxlength="12" autocapitalize="none" placeholder="e.g. Aryan"></label>';
 b.innerHTML=m=='s'?nk+'<div class="av">'+AV.map(a=>'<button class="g" data-a="'+a+'">'+a+'</button>').join('')+'</div>'+pin('pn','PIN (4 digits)')+pin('p2','Confirm PIN')+'<button id="go">Create account</button><div id="er"></div>':nk+pin('pn','PIN')+'<button id="go">Login</button><div id="er"></div>';
 let av=AV[0];const hl=()=>b.querySelectorAll('[data-a]').forEach(y=>y.style.outline=y.dataset.a==av?'3px solid var(--acc)':'');
 b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{av=x.dataset.a;hl()});hl();
 b.querySelectorAll('[data-e]').forEach(x=>x.onclick=e=>{e.preventDefault();const i=$(x.dataset.e);i.type=i.type=='password'?'text':'password'});
 b.querySelectorAll('[type=password]').forEach(i=>i.oninput=()=>{i.value=i.value.replace(/\D/g,'')});
 const sub=async()=>{const n=$('nm').value.trim(),p=$('pn').value;
  if(!/^[A-Za-z0-9]{3,12}$/.test(n))return er('Nickname: 3–12 letters or numbers');
  if(!/^\d{4}$/.test(p))return er('PIN must be 4 digits');
  if(m=='s'&&p!=$('p2').value)return er('PINs do not match');
  er('Please wait…');au=1;
  try{if(m=='s'){const c=await createUserWithEmailAndPassword(auth,em(n),pw(p));U=c.user;await setDoc(doc(db,'players',U.uid),{n,av,data:{},t:Date.now()});enter({n,av},'Account created! 🎉',{})}
  else{const c=await signInWithEmailAndPassword(auth,em(n),pw(p));U=c.user;const d=await pull(U);enter({n:d?d.n:n,av:d?d.av:'🐻'},'Welcome back!',d&&d.data)}}
  catch(e){er(AM(e.code))}au=0};
 $('go').onclick=sub;b.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')sub()});show('au')}
function profScr(){$('pb').innerHTML='<div class="big">'+P.av+'</div><h1>'+esc(P.n)+'</h1><div>⭐ '+S.st.reduce((a,b)=>a+(b||0),0)+' · ✅ '+S.st.filter(x=>x>0).length+'/50 · 🪙 '+S.coins+' · 🏆 '+Object.keys(S.ach).length+'/5</div><button id="lo">Logout</button><button class="g" id="b2">⬅ Back</button><small>Your progress is saved online ☁️</small>';$('lo').onclick=async()=>{await signOut(auth);U=null;P=null;KEY='cma';loadS();sndBtn();home();authScr('l')};$('b2').onclick=home;show('pr')}
$('pfb').onclick=()=>P?profScr():authScr('l');$('tl').onclick=()=>authScr('l');$('ts').onclick=()=>authScr('s');$('ba').onclick=home;
$('gs').onclick=()=>{P=null;KEY='cma';ls('cma_cur',null);loadS();sndBtn();home()};
$('bd').onpointermove=e=>{if(!st||busy)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(Math.abs(dx)>16||Math.abs(dy)>16){const s=st;st=null;const h=Math.abs(dx)>Math.abs(dy);act(s.r,s.c,s.r+(h?0:Math.sign(dy)),s.c+(h?Math.sign(dx):0))}};
onAuthStateChanged(auth,async u=>{if(au)return;if(u){U=u;const d=await pull(u);enter({n:d?d.n:'Player',av:d?d.av:'🐻'},0,d&&d.data)}else{U=null;home();authScr('l')}});
$('pv').onclick=()=>{W=Math.max(0,W-1);mapScr()};$('nxw').onclick=()=>{W=Math.min(4,W+1);mapScr()};
const pop=h=>{$('mb').innerHTML=h+'<button id="ok">OK</button>';$('md').classList.add('on');$('ok').onclick=()=>$('md').classList.remove('on')};
$('gift').onclick=()=>{const d=new Date().toDateString();if(S.gift==d)pop('<h1>🎁</h1><div>You already claimed today’s gift. Come back tomorrow!</div>');else{S.gift=d;S.coins+=50;sv();snd(700,.3);pop('<h1>🎁 Daily Gift!</h1><div>+50 🪙 coins</div>')}};
$('bj').onclick=()=>pop('<h1>🏆 Badges</h1><div class="bl">'+Object.entries(AC).map(([k,v])=>'<div class="'+(S.ach[k]?'':'lk')+'">'+v[0]+' '+v[1]+'</div>').join('')+'</div>');
